# This listener is published on VPS loopback ONLY. The existing TLS proxy must
# overwrite X-Forwarded-Proto and Host; clients cannot reach this trust boundary.
map $http_x_forwarded_proto $trusted_proto {
    default http;
    https https;
}
server {
    listen 80;
    server_name baharnaj.ir www.baharnaj.ir;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 20m; # Individual images are validated at 5 MiB by Django.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    access_log off; # Avoid retaining booking receipts/tokens in query strings.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { access_log off; return 200 'ok'; }
    location ~* (^|/)(\.|node_modules|src)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(@vite|@react-refresh|@id|@fs|__vite|src)(/|$) { return 404; }
    location ~* (\.(env|pem|key|crt|sqlite3?|db|map|bak|log|ya?ml|toml)$|/(package(-lock)?\.json|Dockerfile|vite\.config\.[^/]+|.*service-account.*\.json|.*firebase-adminsdk.*\.json)$) { return 404; }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_baharnaj;
    }
    location = /robots.txt {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_baharnaj;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_baharnaj;
    }
    # Preserve legacy Django login/model URLs; React owns its panel URLs.
    location ~ ^/admin/(login|logout|password_change|jsi18n|autocomplete|r|auth|salon|telegram_crm)(/|$) {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_baharnaj;
    }
    # React owns /admin/*. Django admin also has an unambiguous entry point.
    location /django-admin/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_baharnaj;
    }
    location /static/ { alias /srv/static/; autoindex off; }
    location /media/ {
        alias /srv/media/;
        autoindex off;
        # Never interpret uploaded files or render active HTML/SVG inline.
        types { image/jpeg jpg jpeg; image/png png; image/gif gif; image/webp webp; image/avif avif; }
        default_type application/octet-stream;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header X-Content-Type-Options nosniff always;
    }
    location = /firebase-messaging-sw.js {
        try_files $uri =404;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let saved, size;
        try { saved = localStorage.getItem("baharnaj-theme"); size = localStorage.getItem("baharnaj-text-size"); } catch {}
        document.documentElement.dataset.textSize = ["compact", "normal", "large"].includes(size) ? size : "normal";
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <!--ssr-head-->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!--ssr-data-->
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>

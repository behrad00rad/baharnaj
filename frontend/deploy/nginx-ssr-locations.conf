# Replace only the existing `location = /index.html` and `location /` blocks
# in /etc/nginx/sites-enabled/baharnaj. Keep the existing API, Django admin,
# media, static, assets, fonts, robots, sitemap, TLS and security blocks.
location = /index.html {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    include /etc/nginx/snippets/baharnaj-security-headers.conf;
}

location / {
    try_files $uri @baharnaj_ssr;
    include /etc/nginx/snippets/baharnaj-security-headers.conf;
}

location @baharnaj_ssr {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    include /etc/nginx/snippets/baharnaj-security-headers.conf;
}

services:
  backend:
    build:
      context: ./backend
      target: development
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,host.docker.internal
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://host.docker.internal:5173
      SQLITE_PATH: /data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    command: >-
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: /api/v1/
      VITE_PROXY_TARGET: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:

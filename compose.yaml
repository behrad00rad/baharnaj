services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SQLITE_PATH: /data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    command: >-
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api/v1/
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  sms-worker:
    profiles: [sms]
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - backend_data:/data
    command: python manage.py process_sms --loop --interval 60
    restart: unless-stopped

volumes:
  backend_data:
